<svg role="img" aria-labelledby="bannerTitle bannerDesc" width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title id="bannerTitle">Coral-Wave</title>
  <desc id="bannerDesc">USB audio interface designed by SmallCoral, using ATSAMD21E18A and WM8978.</desc>
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1220"></stop>
      <stop offset="50%" stop-color="#101A2F"></stop>
      <stop offset="100%" stop-color="#0A1424"></stop>
    </linearGradient>

    <!-- 边框渐变 -->
    <linearGradient id="strokeGrad" x1="80" y1="40" x2="1120" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.32"></stop>
    </linearGradient>

    <!-- 主文字渐变 -->
    <linearGradient id="titleGrad" x1="360" y1="90" x2="820" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAF7FF"></stop>
      <stop offset="60%" stop-color="#D8F4FF"></stop>
      <stop offset="100%" stop-color="#B9E7FF"></stop>
    </linearGradient>

    <!-- 波浪渐变 -->
    <linearGradient id="waveGrad" x1="120" y1="110" x2="360" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"></stop>
      <stop offset="100%" stop-color="#67E8F9"></stop>
    </linearGradient>

    <!-- 装饰线 -->
    <linearGradient id="lineGrad" x1="800" y1="160" x2="1080" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.0"></stop>
      <stop offset="30%" stop-color="#7DD3FC" stop-opacity="0.35"></stop>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.0"></stop>
    </linearGradient>

    <!-- 柔光 -->
    <filter id="glowSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <filter id="glowBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- 扫光遮罩 -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="white" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0"></stop>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="20" y="20" width="1160" height="280" rx="28"></rect>
    </clipPath>
  </defs>

  <!-- 卡片底 -->
  <rect x="20" y="20" width="1160" height="280" rx="28" fill="url(#bg)"></rect>
  <rect x="20.75" y="20.75" width="1158.5" height="278.5" rx="27.25" stroke="url(#strokeGrad)" stroke-width="1.5"></rect>

  <!-- 背景光斑 -->
  <g opacity="0.55" clip-path="url(#cardClip)">
    <circle cx="210" cy="85" r="90" fill="#103B4A" filter="url(#glowBig)">
      <animate attributeName="opacity" values="0.30;0.50;0.30" dur="5.5s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="990" cy="245" r="120" fill="#112B4D" filter="url(#glowBig)">
      <animate attributeName="opacity" values="0.24;0.42;0.24" dur="7s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="860" cy="90" r="70" fill="#0E3E52" filter="url(#glowBig)">
      <animate attributeName="opacity" values="0.18;0.34;0.18" dur="6.2s" repeatCount="indefinite"></animate>
    </circle>
  </g>

  <!-- 顶部说明 -->
  <text x="670" y="82" text-anchor="middle" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" letter-spacing="6" fill="#A8C0D8">
    OPEN HARDWARE
  </text>

  <!-- 左侧波浪 LOGO -->
  <g transform="translate(0,2)">
    <path d="M120 176
             C145 136 170 136 195 176
             S245 216 270 176
             S320 136 345 176" fill="none" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glowSmall)">
      <animate attributeName="d" dur="4s" repeatCount="indefinite" values="
               M120 176 C145 136 170 136 195 176 S245 216 270 176 S320 136 345 176;
               M120 176 C145 146 170 146 195 176 S245 206 270 176 S320 146 345 176;
               M120 176 C145 136 170 136 195 176 S245 216 270 176 S320 136 345 176"></animate>
      <animate attributeName="opacity" values="0.88;1;0.88" dur="3.6s" repeatCount="indefinite"></animate>
    </path>

    <!-- 小光点 -->
    <circle cx="121" cy="176" r="3.2" fill="#7CF8EA" filter="url(#glowSmall)">
      <animateMotion dur="4s" repeatCount="indefinite" rotate="auto">
        <mpath href="#waveMotionPath"></mpath>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;0.8;0" dur="4s" repeatCount="indefinite"></animate>
    </circle>

    <!-- 用于光点运动的隐藏路径 -->
    <path id="waveMotionPath" d="M0 0 C25 -40 50 -40 75 0 S125 40 150 0 S200 -40 225 0" fill="none" stroke="none"></path>
  </g>

  <!-- 标题 -->
  <text x="670" y="172" text-anchor="middle" font-size="64" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif" letter-spacing="1.5" fill="url(#titleGrad)">
    Coral-Wave
  </text>

  <!-- 副标题 -->
  <text x="670" y="222" text-anchor="middle" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" letter-spacing="4" fill="#9FB8D1">
    DESIGNED BY SMALLCORAL
  </text>

  <!-- 底部说明 -->
  <text x="670" y="266" text-anchor="middle" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" letter-spacing="5" fill="#8EA7C2">
    USB AUDIO INTERFACE
  </text>

  <!-- 右侧细线 -->
  <g opacity="0.7">
    <line x1="905" y1="176" x2="1080" y2="176" stroke="url(#lineGrad)" stroke-width="2"></line>
    <line x1="915" y1="188" x2="1065" y2="188" stroke="url(#lineGrad)" stroke-width="1"></line>
    <line x1="930" y1="164" x2="1040" y2="164" stroke="url(#lineGrad)" stroke-width="1"></line>
  </g>

  <!-- 规格单独成行，避免与底部说明重叠 -->
  <text x="670" y="286" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#9FDCCF">ATSAMD21E18A · WM8978 · 48 kHz / 16-bit</text>

  <!-- 扫光 -->
  <g clip-path="url(#cardClip)">
    <rect x="-260" y="0" width="180" height="340" transform="rotate(12 0 0)" fill="url(#scanGrad)" opacity="0.0">
      <animate attributeName="x" values="-260;1360" dur="5.8s" repeatCount="indefinite"></animate>
      <animate attributeName="opacity" values="0;0.25;0.25;0" dur="5.8s" repeatCount="indefinite"></animate>
    </rect>
  </g>
</svg>